<div class="topbar">
  <div>
    <div class="topbar-title">{{ title() }}</div>
    <div class="topbar-sub">{{ subtitle() }}</div>
  </div>
  <div class="topbar-right">
    <div class="search-box">
      <hugeicons-icon [icon]="Search01Icon" [size]="14" color="currentColor" [strokeWidth]="2" />
      <input type="text" placeholder="Cerca clienti, pratiche…">
    </div>
    <button class="btn btn-ghost">
      <hugeicons-icon [icon]="FilterIcon" [size]="14" color="currentColor" [strokeWidth]="1.5" />
      Filtra
    </button>
    <button class="btn btn-primary" (click)="ctaClick.emit()">{{ ctaLabel() }}</button>
  </div>
</div>
