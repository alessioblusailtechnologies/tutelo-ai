<aside class="sidebar">
  <div class="sidebar-logo">
    <svg width="34" height="34" viewBox="0 0 72 72" fill="none">
      <defs>
        <linearGradient id="sl1" x1="0" y1="0" x2="72" y2="72" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#3A82D4"/>
          <stop offset="100%" stop-color="#5BAAFF"/>
        </linearGradient>
      </defs>
      <circle cx="17" cy="18" r="11" fill="url(#sl1)"/>
      <circle cx="55" cy="18" r="11" fill="url(#sl1)"/>
      <circle cx="17" cy="18" r="6" fill="white" opacity="0.15"/>
      <circle cx="55" cy="18" r="6" fill="white" opacity="0.15"/>
      <ellipse cx="36" cy="44" rx="28" ry="26" fill="url(#sl1)"/>
      <circle cx="26" cy="40" r="5" fill="white" opacity="0.95"/>
      <circle cx="46" cy="40" r="5" fill="white" opacity="0.95"/>
      <circle cx="26" cy="40" r="2.5" fill="#1A3A6B"/>
      <circle cx="46" cy="40" r="2.5" fill="#1A3A6B"/>
      <circle cx="27.5" cy="38.5" r="1" fill="white" opacity="0.8"/>
      <circle cx="47.5" cy="38.5" r="1" fill="white" opacity="0.8"/>
      <ellipse cx="36" cy="51" rx="5.5" ry="4" fill="white" opacity="0.6"/>
    </svg>
    <div class="name">tutelo<span class="ai">.ai</span></div>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-label">Principale</div>
    <a class="nav-item" routerLink="/dashboard" routerLinkActive="active">
      <hugeicons-icon [icon]="DashboardBrowsingIcon" [size]="18" color="currentColor" [strokeWidth]="1.5" />
      Centro di Controllo
    </a>
    <a class="nav-item" routerLink="/pratiche" routerLinkActive="active">
      <hugeicons-icon [icon]="Folder01Icon" [size]="18" color="currentColor" [strokeWidth]="1.5" />
      Pratiche
    </a>
    <a class="nav-item" routerLink="/agenti" routerLinkActive="active">
      <hugeicons-icon [icon]="AiBrain01Icon" [size]="18" color="currentColor" [strokeWidth]="1.5" />
      Agenti AI
    </a>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-label">Collegamenti</div>
    <a class="nav-item" routerLink="/canali" routerLinkActive="active">
      <hugeicons-icon [icon]="Link01Icon" [size]="18" color="currentColor" [strokeWidth]="1.5" />
      Canali collegati
    </a>
  </div>

  <div class="sidebar-footer">
    <div class="user-row">
      <div class="avatar">{{ initials() }}</div>
      <div class="user-info">
        <div class="user-name">{{ profile()?.full_name || 'Utente' }}</div>
        <div class="user-role">{{ profile()?.role || 'Agente' }}</div>
      </div>
      <button class="logout-btn" (click)="logout()" title="Esci">
        <hugeicons-icon [icon]="Logout01Icon" [size]="16" color="currentColor" [strokeWidth]="1.5" />
      </button>
    </div>
  </div>
</aside>
