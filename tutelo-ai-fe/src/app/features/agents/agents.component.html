<app-topbar
  title="Agenti AI"
  subtitle="Automazioni intelligenti che lavorano per te"
  ctaLabel="+ Nuovo Agente"
  (ctaClick)="openModal()"
/>
<div class="content">
  <!-- Grid -->
  @if (agents().length === 0) {
    <div class="agenti-empty">
      <div class="agenti-empty-icon"><hugeicons-icon [icon]="AiBrain01Icon" [size]="36" color="var(--text-muted)" [strokeWidth]="1.5" /></div>
      <div class="agenti-empty-title">Nessun agente configurato</div>
      <div class="agenti-empty-desc">Crea il tuo primo agente AI per automatizzare le operazioni della tua agenzia.</div>
      <button class="agenti-empty-btn" (click)="openModal()">+ Crea il primo agente</button>
    </div>
  } @else {
    <div class="agenti-grid">
      @for (agent of agents(); track agent.id) {
        <app-agent-card [agent]="agent" />
      }
      <!-- New card -->
      <div class="agent-card new-card" (click)="openModal()">
        <div class="new-card-inner">
          <div class="new-card-plus">+</div>
          <div class="new-card-label">Crea nuovo agente</div>
          <div class="new-card-sub">Descrivi cosa deve fare in linguaggio naturale</div>
        </div>
      </div>
    </div>
  }

  <!-- Log -->
  <app-agent-log />
</div>

@if (showModal()) {
  <app-create-agent-modal (close)="closeModal()" />
}
