<div class="agent-log">
  <div class="agent-log-header">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
    </svg>
    <div class="agent-log-title">Log esecuzioni recenti</div>
    <span class="log-time-range">Ultime 24 ore</span>
  </div>
  @for (entry of logEntries(); track entry.time) {
    <div class="log-item">
      <div class="log-icon" [style.background]="entry.iconBg">{{ entry.icon }}</div>
      <div class="log-text">
        <strong>{{ entry.agentName }}</strong> — <span>{{ entry.detail }}</span>
      </div>
      <div class="log-time">{{ entry.time }}</div>
      <span class="log-result" [class]="entry.result">{{ entry.resultLabel }}</span>
    </div>
  }
</div>
