<div class="modal-overlay" (click)="onOverlayClick($event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-header-icon">
        <hugeicons-icon [icon]="AiBrain01Icon" [size]="18" color="white" [strokeWidth]="1.5" />
      </div>
      <div>
        <div class="modal-title">Nuovo Agente AI</div>
        <div class="modal-sub">Descrivi cosa deve fare — l'AI costruisce i passi automaticamente</div>
      </div>
      <button class="modal-close" (click)="close.emit()"><hugeicons-icon [icon]="Cancel01Icon" [size]="18" color="currentColor" [strokeWidth]="1.5" /></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Nome agente</label>
        <input class="form-input" type="text" placeholder="es. Reminder rinnovi, Triage sinistri…" [(ngModel)]="agentName">
      </div>
      <div class="form-group">
        <label class="form-label">Istruzioni in linguaggio naturale</label>
        <div class="instructions-box">
          <div class="instructions-box-label">Descrivi cosa deve fare l'agente</div>
          <textarea
            class="instructions-textarea"
            placeholder="Trovami tutti gli utenti con la polizza in scadenza entro 30 giorni e invia una mail con il reminder. Se il cliente non risponde entro 5 giorni, apri automaticamente una pratica di rinnovo e avvisami."
            [(ngModel)]="instructions"
          ></textarea>
          <div class="instructions-hint">
            <hugeicons-icon [icon]="InformationCircleIcon" [size]="12" color="currentColor" [strokeWidth]="1.5" />
            Puoi usare linguaggio naturale — l'AI interpreta e costruisce i passi
          </div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Quando si attiva</label>
        <div class="trigger-grid">
          @for (trigger of triggers; track trigger.value) {
            <div
              class="trigger-opt"
              [class.selected]="selectedTrigger() === trigger.value"
              (click)="selectTrigger(trigger.value)"
            >
              <div class="trigger-opt-icon">{{ trigger.icon }}</div>
              <div class="trigger-opt-label">{{ trigger.label }}</div>
              <div class="trigger-opt-sub">{{ trigger.sub }}</div>
            </div>
          }
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" (click)="close.emit()">Annulla</button>
      <button class="btn btn-primary" (click)="createAgent()" [disabled]="saving() || !agentName.trim()">
        @if (saving()) {
          Creazione...
        } @else {
          <hugeicons-icon [icon]="Tick01Icon" [size]="14" color="currentColor" [strokeWidth]="2" /> Crea Agente
        }
      </button>
    </div>
  </div>
</div>
