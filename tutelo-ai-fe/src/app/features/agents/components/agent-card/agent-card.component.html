<div class="agent-card" [class.active-agent]="agent().status === 'running'">
  <div class="agent-card-header">
    <div class="agent-top-row">
      <div class="agent-icon" [style.background]="agent().icon_bg">{{ agent().icon }}</div>
      <div>
        <div class="agent-name">{{ agent().name }}</div>
        <div class="agent-trigger">{{ agent().trigger_label }}</div>
      </div>
      <div class="agent-status-dot" [class]="agent().status"></div>
    </div>
    <div class="agent-desc">{{ agent().description }}</div>
  </div>
  <div class="agent-card-steps">
    @for (step of steps(); track step.step_number) {
      <div class="agent-step">
        <div class="step-num">{{ step.step_number }}</div>
        <div class="step-text">{{ step.text }}</div>
        <span class="step-tag" [class]="step.tag_type">{{ step.tag }}</span>
      </div>
    }
  </div>
  <div class="agent-card-footer">
    <div class="agent-last-run">Creato: <strong>{{ agent().created_at | date:'dd MMM' }}</strong></div>
    <button class="agent-footer-btn edit">Modifica</button>
    @if (agent().status === 'running') {
      <button class="agent-footer-btn pause"><hugeicons-icon [icon]="PauseIcon" [size]="12" color="currentColor" [strokeWidth]="1.5" /> Pausa</button>
    } @else {
      <button class="agent-footer-btn run"><hugeicons-icon [icon]="PlayIcon" [size]="12" color="currentColor" [strokeWidth]="1.5" /> Riattiva</button>
    }
  </div>
</div>
